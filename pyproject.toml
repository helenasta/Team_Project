[project]
name = "rct-final-project-template"
version = "0.1.0"
description = "A barebones Python template for reproducible project workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.2",
    "jupyter>=1.0,<2",
    "pandas>=2.2,<3",
    "plotnine>=0.13,<1",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "great-tables>=0.12",
    "pyfixest>=0.25",
]

[tool.uv]
package = false
